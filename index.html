<script>
(function(){
function init(){
var phone=document.querySelector('.phone-container');
if(!phone)return;
if(document.getElementById('worldBookPanel'))return;

var style=document.createElement('style');
style.textContent=
'.wb-panel{position:absolute;inset:0;z-index:245;background:#faf7f2;transform:translateX(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;border-radius:30px;overflow:hidden}'+
'body.fs-mode .wb-panel{border-radius:0}'+
'.wb-panel.open{transform:translateX(0)}'+
'.wb-nav{flex-shrink:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}'+
'.wb-nav button{background:transparent;border:none;color:#3a3a3a;font-size:15px;cursor:pointer;padding:6px 4px;display:flex;align-items:center;gap:3px;font-family:inherit}'+
'.wb-nav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}'+
'.wb-nav .title{font-size:18px;font-weight:700;color:#2a2a2a}'+
'.wb-nav .add{width:34px;height:34px;border-radius:50%;background:#2a2a2a;color:#fff;display:flex;align-items:center;justify-content:center;padding:0}'+
'.wb-nav .add svg{stroke:#fff;width:20px;height:20px}'+
'.wb-body{flex:1;overflow-y:auto;padding:8px 18px 30px;-webkit-overflow-scrolling:touch}'+
'.wb-body::-webkit-scrollbar{display:none}'+
'.wb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 12px}'+
'.wb-book{position:relative;cursor:pointer}'+
'.wb-cover{width:100%;aspect-ratio:3/4;border-radius:4px;overflow:hidden;background:#e8e4dc;box-shadow:0 3px 10px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;position:relative}'+
'.wb-cover img{width:100%;height:100%;object-fit:cover;display:block}'+
'.wb-cover-default{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#b0a99c;gap:6px;padding:8px;text-align:center;width:100%;height:100%}'+
'.wb-cover-default svg{width:30px;height:30px;stroke:#b0a99c;fill:none;stroke-width:1.5}'+
'.wb-cover-default .fname{color:#8a8275;font-size:10px;line-height:1.3;word-break:break-all;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}'+
'.wb-del{position:absolute;top:5px;left:5px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;font-size:14px;line-height:1;z-index:2}'+
'.wb-title{font-size:13px;color:#2a2a2a;font-weight:600;margin-top:9px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}'+
'.wb-author{font-size:11px;color:#9a9a9a;margin-top:3px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}'+
'.wb-empty{text-align:center;color:#b8b8b8;font-size:13px;padding:80px 20px;grid-column:1/-1}'+
'.wb-empty svg{width:60px;height:60px;stroke:#d0d0d0;fill:none;stroke-width:1.2;margin-bottom:16px}'+
'.wb-viewer{position:absolute;inset:0;background:#fff;z-index:246;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s}'+
'.wb-viewer.show{transform:translateX(0)}'+
'.wb-viewer-nav{flex-shrink:0;height:52px;display:flex;align-items:center;padding:0 14px;background:#f7f7f7;border-bottom:1px solid #e5e5e5}'+
'.wb-viewer-nav button{background:transparent;border:none;color:#07c160;font-size:15px;cursor:pointer;padding:6px 4px;font-family:inherit}'+
'.wb-viewer-nav .vtitle{font-size:15px;font-weight:600;color:#2a2a2a;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px}'+
'.wb-viewer-body{flex:1;overflow-y:auto;padding:16px;font-size:14px;line-height:1.7;color:#1a1a1a;white-space:pre-wrap;word-break:break-word}'+
'.wb-viewer-body::-webkit-scrollbar{display:none}';
document.head.appendChild(style);

var panel=document.createElement('div');
panel.className='wb-panel';
panel.id='worldBookPanel';
panel.innerHTML='<div class="wb-nav"><button id="wbBack"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>返回</button><span class="title">世界书</span><button class="add" id="wbAdd"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div><div class="wb-body"><div class="wb-grid" id="wbGrid"></div></div>';
phone.appendChild(panel);

var viewer=document.createElement('div');
viewer.className='wb-viewer';
viewer.innerHTML='<div class="wb-viewer-nav"><button id="wbViewerBack">返回</button><span class="vtitle" id="wbViewerTitle"></span><span style="width:44px"></span></div><div class="wb-viewer-body" id="wbViewerBody"></div>';
phone.appendChild(viewer);

var grid=panel.querySelector('#wbGrid');
var backBtn=panel.querySelector('#wbBack');
var addBtn=panel.querySelector('#wbAdd');
var viewerBack=viewer.querySelector('#wbViewerBack');
var viewerTitle=viewer.querySelector('#wbViewerTitle');
var viewerBody=viewer.querySelector('#wbViewerBody');

var input=document.createElement('input');
input.type='file';
input.accept='.docx,.json';
input.multiple=true;
input.style.display='none';
document.body.appendChild(input);

function getBooks(){try{var r=localStorage.getItem('world-books');if(r){var v=JSON.parse(r);if(Array.isArray(v))return v;}}catch(e){}return[];}
function saveBooks(b){try{localStorage.setItem('world-books',JSON.stringify(b));}catch(e){}}

function render(){
var books=getBooks();
grid.innerHTML='';
if(books.length===0){
grid.innerHTML='<div class="wb-empty"><svg viewBox="0 0 24 24"><path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M4 16a4 4 0 0 1 4-4h12"/></svg><div>还没有世界书<br>点击右上角 + 上传</div></div>';
return;
}
books.forEach(function(b,idx){
var el=document.createElement('div');
el.className='wb-book';
var cover=document.createElement('div');
cover.className='wb-cover';
if(b.cover){
var im=document.createElement('img');
im.src=b.cover;
cover.appendChild(im);
}else{
var dv=document.createElement('div');
dv.className='wb-cover-default';
dv.innerHTML='<svg viewBox="0 0 24 24"><path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M4 16a4 4 0 0 1 4-4h12"/></svg>';
var fn=document.createElement('div');
fn.className='fname';
fn.textContent=b.name||'世界书';
dv.appendChild(fn);
cover.appendChild(dv);
}
el.appendChild(cover);
var del=document.createElement('button');
del.className='wb-del';
del.textContent='×';
del.addEventListener('click',function(e){
e.stopPropagation();
if(!confirm('确定删除「'+(b.name||'世界书')+'」吗？'))return;
var arr=getBooks();
arr.splice(idx,1);
saveBooks(arr);
render();
});
el.appendChild(del);
var t=document.createElement('div');
t.className='wb-title';
t.textContent=b.name||'未命名';
el.appendChild(t);
if(b.subtitle){
var a=document.createElement('div');
a.className='wb-author';
a.textContent=b.subtitle;
el.appendChild(a);
}
el.addEventListener('click',function(){openViewer(b);});
grid.appendChild(el);
});
}

function openViewer(b){
viewerTitle.textContent=b.name||'世界书';
viewerBody.textContent=b.content||'（无内容）';
viewer.classList.add('show');
}
viewerBack.addEventListener('click',function(){viewer.classList.remove('show');});

addBtn.addEventListener('click',function(){input.click();});
input.addEventListener('change',function(e){
var files=Array.prototype.slice.call(e.target.files||[]);
if(files.length===0)return;
var pending=files.length;
files.forEach(function(f){
var isDocx=/\.docx$/i.test(f.name);
var reader=new FileReader();
reader.onload=function(ev){
if(isDocx){
if(window.mammoth){
mammoth.extractRawText({arrayBuffer:ev.target.result}).then(function(r){
addBook(f.name,r.value);
done();
}).catch(function(){
addBook(f.name,'（docx 解析失败）');
done();
});
}else{
addBook(f.name,'（docx 解析库未加载）');
done();
}
}else{
var content='';
try{
var parsed=JSON.parse(ev.target.result);
content=JSON.stringify(parsed,null,2);
}catch(err){
content=String(ev.target.result);
}
addBook(f.name,content);
done();
}
};
if(isDocx)reader.readAsArrayBuffer(f);
else reader.readAsText(f);
});
function done(){
pending--;
if(pending===0){input.value='';render();}
}
});

function addBook(name,content){
var arr=getBooks();
var displayName=name.replace(/\.(docx|json)$/i,'');
arr.unshift({
id:'b_'+Date.now()+'_'+Math.floor(Math.random()*999),
name:displayName,
subtitle:'',
content:content||'',
cover:''
});
saveBooks(arr);
}

backBtn.addEventListener('click',function(){panel.classList.remove('open');});

var items=document.querySelectorAll('#page-2 .p2-app-grid .p2-app-item');
var taobaoIcon=items[1];
if(taobaoIcon){
var nb=taobaoIcon.cloneNode(true);
taobaoIcon.parentNode.replaceChild(nb,taobaoIcon);
var nm=nb.querySelector('span');
if(nm)nm.textContent='世界书';
nb.addEventListener('click',function(e){
e.stopPropagation();
panel.classList.add('open');
render();
});
}

render();
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}
else{setTimeout(init,500);}
})();
</script>
